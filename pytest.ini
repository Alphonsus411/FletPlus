[pytest]
addopts = -m "not perf"
markers =
    perf: pruebas de rendimiento ligeras para el enrutador
    aggregate_contract: meta-pruebas ligeras para contrato/importabilidad; la agregación funcional debe hacerse por selección de rutas de pytest
    domain_core: pruebas que ejercitan la core moderna (`fletplus.core`).
    domain_legacy: pruebas que ejercitan la core legacy (`fletplus.core_legacy`).
